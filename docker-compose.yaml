services:
  mysql:
    image: mysql:8.4
    container_name: ignoa-payment-mysql
    env_file: .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "43306:3306"
    volumes:
      - payment-mysql-data:/var/lib/mysql
      - ./scripts/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/ignoa-market/ignoa-payment:${IMAGE_TAG:-prod}
    container_name: ignoa-payment
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    ports:
      - "48080:48080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:48080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  payment-mysql-data:
