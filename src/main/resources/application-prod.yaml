spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 테이블은 scripts/schema/*.sql로 만든다. 여기서는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

ignoa:
  cloudfront-origin:
    enabled: true

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  context-tags: trace_id